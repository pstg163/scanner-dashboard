<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ec" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Live police, fire, and EMS scanner alerts for Ontario, Seneca, Wayne, Yates, Monroe, Cayuga, and Onondaga counties."
    />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scanner" />
    <script>
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('scanner-bot.theme')
          if (stored === 'dark' || stored === 'light') theme = stored
        } catch (e) {}
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        root.style.colorScheme = theme
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#121418' : '#f3f1ec')
        var colorScheme = document.querySelector('meta[name="color-scheme"]')
        if (colorScheme) colorScheme.setAttribute('content', theme)
        var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
        if (statusBar) statusBar.setAttribute('content', theme === 'dark' ? 'black-translucent' : 'default')
      })()
    </script>
    <style>
      html, body { background: #f3f1ec; color: #172033; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #121418; color: #f2f4f7; }
    </style>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Scanner Bot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
